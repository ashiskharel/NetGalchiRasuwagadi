name: Daily restoration draft

on:
  schedule:
    # 07:00 NPT (UTC+5:45) ≈ 01:15 UTC
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch RIS and news into drafts/
        run: node scripts/fetch-draft.mjs
      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts public/data/tles.json public/data/sentinel1.json src/content/bulletins
          if git diff --staged --quiet; then
            echo "No draft changes"
            exit 0
          fi
          git commit -m "draft: RIS and news snapshot $(date -u +%Y-%m-%d)"
          git push
